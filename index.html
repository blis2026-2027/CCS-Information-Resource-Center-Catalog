<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silliman University - College of Computer Studies Information Resource Center Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header-bar">
      <div class="brand-section">
        <svg class="brand-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <div class="brand-titles">
          <span class="brand-institution">Silliman University</span>
          <h1 class="brand-title-main">College of Computer Studies</h1>
          <p class="brand-subtitle">Information Resource Center Catalog</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-archive-xml" onclick="viewFullXmlArchive()">
          <span>&lt;&gt;</span> View Full XML Archive
        </button>
        <div class="records-count-badge" id="record-count">0 Records Loaded</div>
      </div>
    </header>

    <!-- Controls Row -->
    <div class="controls-row">
      <div class="search-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search by title, author, publisher, ISBN, or subject..." onkeyup="filterCatalog()">
      </div>
      <div class="view-toggle">
        <button class="toggle-btn active" id="grid-view-btn" onclick="setViewMode('grid')">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zM2.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zM1 10.5A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3z"/>
          </svg> Grid
        </button>
        <button class="toggle-btn" id="list-view-btn" onclick="setViewMode('list')">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
          </svg> List
        </button>
      </div>
    </div>

    <!-- Main Content Layout -->
    <main class="catalog-layout grid" id="book-grid"></main>
  </div>

  <!-- Inspection Modal Drawer -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Record Metadata</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="meta-grid" id="modal-meta"></div>
        <div class="xml-container" id="xml-container">
          <label style="display: block; font-size: 0.725rem; text-transform: uppercase; font-weight: 800; color: var(--header-dark); margin-bottom: 6px;">Dublin Core XML Source</label>
          <pre class="xml-box" id="modal-xml-text"></pre>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="toggleXmlView()" id="toggle-xml-btn">Show XML Code</button>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="copyXmlCode()">Copy XML</button>
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">XML copied to clipboard!</div>

  <script src="script.js"></script>
</body>
</html>
